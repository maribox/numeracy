name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Before the tag: a version that fails its tests is never tagged, so no tag is left pointing at
      # a release that was never built.
      - name: Test
        run: ./gradlew :composeApp:jvmTest

      - name: Determine version bump from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          tag_prefix: v

      - name: Decode keystore
        if: steps.tag.outputs.new_tag
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # The APK is what a person sideloads from the release page; the bundle is what Play takes.
      - name: Build signed release APK and bundle
        if: steps.tag.outputs.new_tag
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Name the artifacts after the tag
        if: steps.tag.outputs.new_tag
        run: |
          mv androidApp/build/outputs/apk/release/*.apk numeracy-${{ steps.tag.outputs.new_tag }}.apk
          mv androidApp/build/outputs/bundle/release/*.aab numeracy-${{ steps.tag.outputs.new_tag }}.aab

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: numeracy-${{ steps.tag.outputs.new_tag }}.apk

      # The bundle goes to Play rather than to the release page: it is signed with the upload key
      # and is of no use to anyone sideloading.
      - name: Keep the bundle for the Play upload
        if: steps.tag.outputs.new_tag
        uses: actions/upload-artifact@v4
        with:
          name: numeracy-${{ steps.tag.outputs.new_tag }}-bundle
          path: numeracy-${{ steps.tag.outputs.new_tag }}.aab
