name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The generators, grading, the practice session and storage are checked on every push; a
      # question with a wrong answer is caught here rather than by someone practising it.
      - name: Test
        run: ./gradlew :composeApp:jvmTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: composeApp/build/reports/tests/

      # The web targets share the common code; a JVM-only call in it breaks them without breaking
      # anything the Android build checks.
      - name: Compile for the web
        run: ./gradlew :composeApp:compileKotlinJs :composeApp:compileKotlinWasmJs

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: numeracy-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  # iOS compiles only on macOS, and nothing else checks that the common code still builds there.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Temurin comes from its own mirror; the JetBrains runtime is looked up through the GitHub API,
      # which rate-limits shared macOS runners.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile for iOS
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosArm64
